name: Test install.sh

on:
  push:
    branches: [main]
    paths: [install.sh]
  pull_request:
  workflow_dispatch:
    inputs:
      casks:
        description: Also install casks (GUI apps, slow)
        type: boolean
        default: false

jobs:
  install:
    runs-on: macos-26 # Tahoe, Apple Silicon
    timeout-minutes: 60
    env:
      DOTFILES_SKIP_CASKS: ${{ inputs.casks && '0' || '1' }}
      DOTFILES_FORCE: "1" # the runner ships its own ~/.zshrc, ~/.gitconfig etc.
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # avoid GitHub API rate limits for "latest" tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: |
          sh -n install.sh
          brew install shellcheck
          shellcheck -s sh -S error install.sh

      # .zshrc hardcodes ~/dotfiles, so expose the checkout there
      - name: Link checkout to ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      - name: Run install.sh
        run: ./install.sh

      - name: Run install.sh again (idempotency)
        run: ./install.sh

      - name: Verify
        shell: zsh {0}
        run: |
          set -e
          for link in .zshrc .p10k.zsh .gitconfig .config/mise .config/dtop/config.yaml; do
            test -L "$HOME/$link" || { echo "missing symlink: ~/$link"; exit 1; }
            test -e "$HOME/$link" || { echo "broken symlink: ~/$link"; exit 1; }
          done
          test -d "$HOME/dotfiles/themes/powerlevel10k"
          test -d "$HOME/.oh-my-zsh"
          # Partially managed files: an Include line and merged keys
          head -1 ~/.ssh/config | grep -qx "Include ~/dotfiles/.ssh.config"
          jq -e '.permissions.deny | length > 0' ~/.claude/settings.json
          # Everything declared in mise/config.toml is in place (skipped casks don't count)
          MISE_SYSTEM_PACKAGES_MANAGERS=brew ~/.local/bin/mise bootstrap status --missing
          # PHP 8.5 is linked as `php` and Composer runs on it
          /opt/homebrew/bin/php -v | grep -q '^PHP 8\.5\.'
          PATH="/opt/homebrew/bin:$HOME/.local/share/mise/shims:$PATH" composer --version
          # Interactive zsh must start cleanly with the dotfiles loaded
          zsh -i -c 'echo "zsh OK: ZSH_CUSTOM=$ZSH_CUSTOM"' 2>&1 | tee zsh.log
          ! grep -iE "command not found|no such file|error" zsh.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## install.sh on \`${{ runner.os }} $(sw_vers -productVersion)\`"
            echo
            echo "- Branch: \`${{ github.ref_name }}\` (\`${GITHUB_SHA::7}\`)"
            echo "- Casks: $([ "$DOTFILES_SKIP_CASKS" = 1 ] && echo skipped || echo installed)"
            echo
            if [ -x ~/.local/bin/mise ]; then
              PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH" ./scripts/versions.sh markdown
            else
              echo "_mise was not installed, no versions to report._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
